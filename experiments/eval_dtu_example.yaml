name: eval_dtu_example
description: >
  Arch A feature-domain JSCC × SNR — transmit-once, DTU global alignment,
  Acc / Comp / Overall in mm.  Template: edit the dataset paths under
  `defaults` and the checkpoint paths under `sweep` to match your setup.
type: eval
script: eval_dtu
output_dir: results/dtu_arch_a/
gpus: [0]

env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

defaults:
  weights:   checkpoints/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth
  # ---- EDIT THESE THREE PATHS ----
  dtu_test:  /path/to/dtu/dtu-test          # scanN/images + cams
  gt_dir:    /path/to/dtu                   # GT point clouds (Points/stl)
  dtueval:   /path/to/DTUeval-python        # clone of jzhangbs/DTUeval-python
  # --------------------------------
  n_views:   20
  niter:     300
  conf_thr:  3
  gt_pose:   true
  tx_mode:   once      # one channel use per view (realistic); 'per_pair' is not
  channel:   awgn

sweep:
  - axis: model
    values:
      - label: r0.5
        jscc_weights: checkpoints/e2eA_awgn_snr0-20_r0.5/checkpoint-last.pth
      - label: r0.125
        jscc_weights: checkpoints/e2eA_awgn_snr0-20_r0.125/checkpoint-last.pth
  - axis: snr
    values: [inf, 20, 10, 0]

output: "{label}_snr{snr}.json"

# Clean DUSt3R baseline (no SemCom block at all)
extra:
  - label: clean
    snr: inf
    output: clean_snrinf.json
