name: train_arch_a
description: >
  Arch A end-to-end joint training — ViT encoder → feature JSCC → AWGN →
  feature decoder → DUSt3R head. One job per compression ratio (k / 1024).
type: train
script: train_e2e
gpus: [0]   # train one model at a time; e.g. [0, 1] for parallel

env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

defaults:
  weights:            checkpoints/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth
  dataset:            "10000 @ BlendedMVS(split='train', ROOT='data/blendedmvs_processed', resolution=512, aug_crop=16)"
  domain:             feature
  channel:            awgn
  snr_range:          [0, 20]
  freeze:             none
  epochs:             50
  batch_size:         2
  accum_iter:         8
  lr:                 5.0e-5
  backbone_lr_scale:  0.05
  amp:                true

sweep:
  - axis: ratio
    values: [0.5, 0.25, 0.125, 0.0625]

output_dir: "checkpoints/e2eA_awgn_snr0-20_r{ratio}/"
