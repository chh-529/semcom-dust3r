name: train_arch_b
description: >
  Arch B end-to-end joint training — image-domain CNN-JSCC transmitter,
  full DUSt3R at the receiver.  Bandwidth ratio = c_out / 48.
  Budget-match to Arch A via c_out = k / 16  (k = 128 <-> c_out = 8).
type: train
script: train_e2e
gpus: [0]

env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

defaults:
  weights:            checkpoints/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth
  dataset:            "10000 @ BlendedMVS(split='train', ROOT='data/blendedmvs_processed', resolution=512, aug_crop=16)"
  domain:             image
  channel:            awgn
  snr_range:          [0, 20]
  freeze:             none
  epochs:             20
  batch_size:         1
  accum_iter:         8
  lr:                 5.0e-5
  backbone_lr_scale:  0.05
  amp:                true

sweep:
  - axis: img_c_out
    values:
      - label: c24
        img_c_out: 24
      - label: c8
        img_c_out: 8
      - label: c3
        img_c_out: 3

output_dir: "checkpoints/e2eB_awgn_snr0-20_{label}/"
